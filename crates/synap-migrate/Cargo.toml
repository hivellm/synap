[package]
name = "synap-migrate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Migration tool for Synap standalone to HiveHub.Cloud SaaS mode"

[[bin]]
name = "synap-migrate"
path = "src/main.rs"

[dependencies]
# The server's persistence codec and recovery (snapshot and WAL formats,
# record replay) and its Hub naming. Using the server library keeps one
# implementation of each; synap-server does not depend on this crate, so
# there is no cycle.
synap-server = { path = "../synap-server" }

# Workspace dependencies
tokio.workspace = true
anyhow.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# CLI framework
clap = { version = "4.5", features = ["derive"] }

[features]
# Build and run the integration tests in tests/. Each file is its own binary
# that links the whole server, so plain `cargo test` runs the unit tests
# only; `cargo test-full` (see .cargo/config.toml) turns this on for the
# release gate and CI, as synap-server's feature of the same name does.
full-tests = []

[dev-dependencies]
tempfile = "3.15"
serde_json.workspace = true
axum.workspace = true
futures-util = "0.3"
reqwest = { version = "0.13", features = ["json"] }

# Integration tests only build with `full-tests` (see [features]).
[[test]]
name = "real_server_fixtures_tests"
required-features = ["full-tests"]
