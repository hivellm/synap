[package]
name = "synap-migrate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Migration tool for Synap standalone to HiveHub.Cloud SaaS mode"

[[bin]]
name = "synap-migrate"
path = "src/main.rs"

[dependencies]
# The server's persistence codec and recovery (snapshot and WAL formats,
# record replay) and its Hub naming. Using the server library keeps one
# implementation of each; synap-server does not depend on this crate, so
# there is no cycle.
synap-server = { path = "../synap-server" }

# Workspace dependencies
tokio.workspace = true
anyhow.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# CLI framework
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3.15"
