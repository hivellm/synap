name: Rust CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # CI starts from a cold cache, so incremental compilation only adds
  # artifacts and slows the build. See docs/rust-target-hygiene.md.
  CARGO_INCREMENTAL: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-test

      - name: Run cargo check
        run: cargo check --workspace --all-targets --locked --verbose

      - name: Run unit tests
        run: cargo test --workspace --lib --locked --verbose

      # Integration tests only build with the `full-tests` feature; the
      # `test-full` alias in .cargo/config.toml enables it workspace-wide.
      - name: Run integration tests
        run: cargo test-full --tests --locked --verbose

      - name: Run doc tests
        run: cargo test --workspace --doc --locked --verbose

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: bench

      - name: Run benchmarks (compile only)
        run: cargo bench --workspace --no-run --locked

  build:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-build

      - name: Build synap-server
        run: cargo build --release --locked --package synap-server --verbose

      - name: Build synap-cli
        run: cargo build --release --locked --package synap-cli --verbose

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: synap-${{ matrix.os }}
          path: |
            target/release/synap-server*
            target/release/synap-cli*
          retention-days: 7

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - name: Generate coverage
        run: cargo llvm-cov --lib --workspace --locked --lcov --output-path lcov.info

      # Fails when a crate drops below its floor in .github/coverage-floors.json
      # and prints the gap to the 95% policy. See docs/development/CI_GATES.md.
      - name: Coverage gate
        run: python3 scripts/ci/coverage_gate.py synap-core synap-server synap-sdk

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
