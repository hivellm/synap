name: Set up the pinned Rust toolchain
description: >
  Installs the toolchain rust-toolchain.toml pins, with the components that
  file lists plus any a job adds. Every workflow goes through this action, so
  the compiler is chosen in exactly one place: rust-toolchain.toml.

inputs:
  components:
    description: Extra components beyond rust-toolchain.toml's, comma-separated
    required: false
    default: ""
  targets:
    description: Extra compilation targets, comma-separated
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Read rust-toolchain.toml
      id: pin
      shell: bash
      env:
        EXTRA_COMPONENTS: ${{ inputs.components }}
      run: |
        channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)
        pinned=$(sed -n 's/^components *= *\[\(.*\)\].*/\1/p' rust-toolchain.toml | tr -d ' "')
        if [ -z "$channel" ]; then
          echo "::error file=rust-toolchain.toml::no channel found"
          exit 1
        fi
        components="$pinned"
        if [ -n "$EXTRA_COMPONENTS" ]; then
          components="${components:+$components,}$EXTRA_COMPONENTS"
        fi
        echo "toolchain=$channel" >> "$GITHUB_OUTPUT"
        echo "components=$components" >> "$GITHUB_OUTPUT"
        echo "Pinned toolchain: $channel (components: ${components:-none})"

    - name: Install ${{ steps.pin.outputs.toolchain }}
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.pin.outputs.toolchain }}
        components: ${{ steps.pin.outputs.components }}
        targets: ${{ inputs.targets }}
