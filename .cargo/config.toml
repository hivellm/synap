[target.x86_64-unknown-linux-musl]
linker = "gcc"

[target.aarch64-unknown-linux-musl]
linker = "gcc"

[build]
target-dir = "target"

[alias]
# Full suite, integration tests included: the release gate. Plain `cargo test`
# runs the unit tests and doctests only.
test-full = "test --workspace --features synap-server/full-tests,synap-sdk/full-tests,synap-cli/full-tests"
